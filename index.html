<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pengumpulan Hasil Praktik Live Sales</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{--p:#6D28D9;--pd:#4C1D95;--pl:#F3EEFF;--ink:#1E1535;--muted:#6B6485;--line:#DDD6EE;--bg:#F5F2FC;--err:#C62828;--ok:#15803D}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'Public Sans',system-ui,sans-serif;line-height:1.5}
  .hero{background:linear-gradient(180deg,#2E1065,var(--pd))}
  .hero img{display:block;width:100%;max-width:1200px;height:auto;margin:0 auto}
  .hero.empty{height:140px}
  main{max-width:760px;margin:28px auto 56px;padding:0 16px}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:32px 28px;box-shadow:0 12px 40px rgba(76,29,149,.10)}
  h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:clamp(1.5rem,4.5vw,2rem);line-height:1.15;color:var(--pd);margin:0 0 6px}
  .sub{color:var(--muted);margin:0 0 28px;font-size:.95rem}
  .sec{display:flex;align-items:center;gap:10px;font-family:'Bricolage Grotesque',sans-serif;font-weight:700;font-size:1.05rem;color:var(--pd);margin:0 0 16px;padding-top:6px;border-top:1px solid var(--line);padding-top:22px}
  .sec:first-of-type{border-top:0;padding-top:0}
  .sec b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--p);color:#fff;font-size:.8rem}
  fieldset{border:0;padding:0;margin:0 0 20px}
  legend,label.t{font-weight:600;font-size:.92rem;display:block;margin-bottom:8px;padding:0}
  .hint{color:var(--muted);font-size:.85rem;font-weight:400}
  .opts{display:flex;flex-wrap:wrap;gap:8px}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt span{display:block;padding:10px 16px;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;background:#fff;transition:background .15s,border-color .15s,color .15s}
  .opt span:hover{border-color:var(--p);background:var(--pl)}
  .opt input:checked+span{background:var(--p);border-color:var(--p);color:#fff}
  .opt input:focus-visible+span{outline:3px solid #C4B5FD;outline-offset:2px}
  .opts.col .opt{flex:1 1 100%}
  .field{margin-bottom:20px}
  input[type=text],input[type=file]{width:100%;padding:12px 14px;font:inherit;border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  input[type=text]:focus,input[type=file]:focus{outline:3px solid #C4B5FD;border-color:var(--p)}
  input[type=file]::file-selector-button{margin-right:12px;padding:8px 14px;border:0;border-radius:8px;background:var(--pl);color:var(--pd);font:inherit;font-weight:600;cursor:pointer}
  .bar{height:10px;background:var(--pl);border-radius:99px;margin-top:12px;overflow:hidden}
  #fill{height:100%;width:0;background:linear-gradient(90deg,var(--p),#A855F7);transition:width .2s}
  .err{color:var(--err);font-size:.9rem;min-height:1.3em;margin-bottom:10px}
  button{width:100%;padding:15px;font:inherit;font-weight:600;font-size:1rem;color:#fff;background:linear-gradient(135deg,var(--p),var(--pd));border:0;border-radius:12px;cursor:pointer;transition:transform .1s,box-shadow .2s}
  button:hover:not(:disabled){box-shadow:0 8px 22px rgba(109,40,217,.35)}
  button:active:not(:disabled){transform:scale(.99)}
  button:disabled{opacity:.65;cursor:wait}
  .done{text-align:center;padding:48px 24px}
  .done .ck{width:64px;height:64px;border-radius:50%;background:#DCFCE7;color:var(--ok);display:grid;place-items:center;margin:0 auto 16px}
  .done h2{font-family:'Bricolage Grotesque',sans-serif;color:var(--pd);margin:0 0 6px}
  .done p{color:var(--muted);margin:0}
  .done button{max-width:280px;margin-top:24px}
  #loading{text-align:center;padding:40px 0;color:var(--muted)}
  [hidden]{display:none!important}
  @media (max-width:520px){.card{padding:24px 18px}}
</style>
</head>
<body>
<header class="hero empty" id="hero"><img id="heroImg" alt="Pengumpulan Tugas Live Sales" hidden></header>

<main>
  <div class="card" id="formCard">
    <h1 id="judul">Pengumpulan Hasil Praktik Live Sales</h1>
    <p class="sub">Isi data dengan benar, lalu unggah video hasil praktik Anda.</p>
    <p id="loading">Memuat form...</p>

    <form id="form" novalidate hidden>
      <div class="sec"><b>1</b>Pelaksanaan</div>
      <fieldset><legend>Hari/tanggal pelaksanaan</legend><div class="opts col" id="pelaksanaan"></div></fieldset>
      <fieldset><legend>Tempat pelaksanaan</legend><div class="opts" id="tempat"></div></fieldset>

      <div class="sec" style="margin-top:28px"><b>2</b>Data siswa</div>
      <div class="field">
        <label class="t" for="nama">Nama lengkap</label>
        <input type="text" id="nama" autocomplete="name" placeholder="Tulis nama lengkap">
      </div>
      <fieldset><legend>Kelas</legend><div class="opts" id="kelas"></div></fieldset>
      <div class="field">
        <label class="t" for="jurusan">Jurusan</label>
        <input type="text" id="jurusan" placeholder="Tulis jurusan">
      </div>
      <fieldset><legend>Asal sekolah</legend><div class="opts col" id="sekolah"></div></fieldset>

      <div class="sec" style="margin-top:28px"><b>3</b>Video praktik</div>
      <div class="field">
        <label class="t" for="video">File video</label>
        <input type="file" id="video" accept="video/*">
        <div class="bar" id="bar" hidden><div id="fill"></div></div>
        <div class="hint" id="pct" style="margin-top:8px" hidden></div>
      </div>

      <div class="err" id="err" role="alert"></div>
      <button type="submit" id="kirim">Kirim data</button>
    </form>
  </div>

  <section class="card done" id="done" hidden>
    <div class="ck"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg></div>
    <h2>Data berhasil dikirim</h2>
    <p>Terima kasih, hasil praktik Anda sudah tercatat.</p>
    <button type="button" id="lagi">Kirim data lagi</button>
  </section>
</main>

<script>
  // Tempel URL web app Apps Script (berakhiran /exec) di sini:
  const API = 'https://script.google.com/macros/s/AKfycbx3HVfjp_ZWBuhYKJRIYEuoq6rh1-UfCaCe83lIU7YAL5uJW3fO5yttS3m2Jm48AK6Dyg/exec';
  let CFG = { maxMB: 500 };

  const $ = function (id) { return document.getElementById(id); };
  const pick = function (n) { const c = document.querySelector('input[name=' + n + ']:checked'); return c ? c.value : ''; };

  function radios(id, name, items) {
    $(id).innerHTML = items.map(function (v) {
      return '<label class="opt"><input type="radio" name="' + name + '" value="' + v.replace(/"/g, '&quot;') + '"><span></span></label>';
    }).join('');
    document.querySelectorAll('#' + id + ' span').forEach(function (s, i) { s.textContent = items[i]; });
  }

  const CHUNK = 3 * 1024 * 1024; // kelipatan 256 KB
  const call = async function (action, payload) {
    const r = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action: action }, payload)) });
    return r.json();
  };
  const b64 = function (blob) {
    return new Promise(function (ok, no) {
      const r = new FileReader();
      r.onload = function () { ok(String(r.result).split(',')[1]); };
      r.onerror = no; r.readAsDataURL(blob);
    });
  };
  function busy(on, txt) {
    $('kirim').disabled = on; $('kirim').textContent = on ? 'Mengunggah...' : 'Kirim data';
    $('bar').hidden = !on; $('pct').hidden = !on; if (txt) $('pct').textContent = txt;
  }

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const file = $('video').files[0];
    const d = { pelaksanaan: pick('pelaksanaan'), tempat: pick('tempat'), nama: $('nama').value.trim(),
      kelas: pick('kelas'), jurusan: $('jurusan').value.trim(), sekolah: pick('sekolah') };
    let msg = '';
    if (!d.pelaksanaan) msg = 'Pilih hari/tanggal pelaksanaan.';
    else if (!d.tempat) msg = 'Pilih tempat pelaksanaan.';
    else if (d.nama.length < 3) msg = 'Isi nama lengkap.';
    else if (!d.kelas) msg = 'Pilih kelas.';
    else if (d.jurusan.length < 2) msg = 'Isi jurusan.';
    else if (!d.sekolah) msg = 'Pilih asal sekolah.';
    else if (!file) msg = 'Pilih file video praktik.';
    else if (file.type.indexOf('video/') !== 0) msg = 'File harus berupa video.';
    else if (file.size > CFG.maxMB * 1048576) msg = 'Ukuran video maksimal ' + CFG.maxMB + ' MB.';
    $('err').textContent = msg;
    if (msg) return;

    busy(true, 'Menyiapkan unggahan...'); $('fill').style.width = '0';
    try {
      const s = await call('mulai', { d: d, m: { name: file.name, type: file.type, size: file.size } });
      if (!s.ok) throw new Error(s.message);
      let start = 0, fileId = '';
      while (start < file.size) {
        const end = Math.min(start + CHUNK, file.size);
        const r = await call('chunk', { url: s.sessionUrl, b64: await b64(file.slice(start, end)), start: start, end: end, total: file.size });
        if (!r.ok) throw new Error(r.message);
        if (r.fileId) fileId = r.fileId;
        start = end;
        const p = Math.round(start / file.size * 100);
        $('fill').style.width = p + '%'; $('pct').textContent = 'Mengunggah ' + p + '%. Jangan tutup halaman ini.';
      }
      if (!fileId) throw new Error('Unggahan belum selesai. Coba lagi.');
      $('pct').textContent = 'Menyimpan data...';
      const f = await call('selesai', { d: d, fileId: fileId });
      if (!f.ok) throw new Error(f.message);
      busy(false); $('formCard').hidden = true; $('done').hidden = false; window.scrollTo(0, 0);
    } catch (er) {
      busy(false); $('err').textContent = er.message + ' Silakan coba lagi.';
    }
  });

  $('lagi').addEventListener('click', function () {
    $('form').reset(); $('err').textContent = '';
    $('done').hidden = true; $('formCard').hidden = false;
  });

  function init(c) {
    CFG = c;
    document.title = c.judul; $('judul').textContent = c.judul;
    if (c.fotoHeader) {
      const img = $('heroImg');
      img.onload = function () { img.hidden = false; $('hero').classList.remove('empty'); };
      img.src = c.fotoHeader;
    }
    radios('pelaksanaan', 'pelaksanaan', c.pelaksanaan);
    radios('tempat', 'tempat', c.tempat);
    radios('kelas', 'kelas', c.kelas);
    radios('sekolah', 'sekolah', c.sekolah);
    $('loading').hidden = true; $('form').hidden = false;
  }
  fetch(API).then(function (r) { return r.json(); }).then(init)
    .catch(function () { $('loading').textContent = 'Gagal memuat form. Muat ulang halaman.'; });
</script>
</body>
</html>
